<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1920px; background: #05010d; color: #fff;
    font-family: "Arial Black", Arial, sans-serif; display: flex; flex-direction: column;
    justify-content: center; align-items: center; overflow: hidden; }
  .small { font-family: monospace; font-size: 44px; letter-spacing: 10px; color: #8f8bb8; margin-bottom: 60px; }
  .big { font-size: 190px; line-height: 1.02; text-align: center; font-weight: 900; }
  .pink { color: #ff2d95; text-shadow: 0 0 60px rgba(255,45,149,.8); }
  .cyan { color: #22e6ff; text-shadow: 0 0 60px rgba(34,230,255,.8); }
  .bar { width: 420px; height: 10px; background: #ff2d95; margin: 70px 0 0 0; border-radius: 5px; }
</style></head>
<body>
  <div class="small">MY AI AGENT · ONE PROMPT</div>
  <div class="big pink">ONE<br>PROMPT.</div>
  <div class="bar"></div>
  <div class="big cyan" style="margin-top:70px">ONE<br>GAME.</div>
</body></html>
