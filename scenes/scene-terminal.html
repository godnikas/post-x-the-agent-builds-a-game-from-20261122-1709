<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1920px; background: #05010d; color: #e8e6ff;
    font-family: monospace; display: flex; flex-direction: column;
    justify-content: center; padding: 0 70px; overflow: hidden; }
  .label { font-size: 40px; letter-spacing: 8px; color: #8f8bb8; margin-bottom: 50px; }
  .term { background: #0d0a24; border: 3px solid #2c2370; border-radius: 28px; padding: 48px 44px;
    font-size: 33px; line-height: 1.85; box-shadow: 0 0 80px rgba(80,40,220,.3); }
  .term .g { color: #4ade80; } .term .c { color: #22e6ff; } .term .y { color: #ffe94a; }
  .term .p { color: #ff2d95; } .term .d { color: #8f8bb8; }
  .cursor { display: inline-block; width: 20px; height: 36px; background: #e8e6ff; vertical-align: -4px; }
  .foot { margin-top: 56px; font-size: 38px; color: #8f8bb8; }
  .foot b { color: #4ade80; }
</style></head>
<body>
  <div class="label">THE AGENT, AT WORK</div>
  <div class="term">
    <span class="g">$</span> makefun init <span class="d"># anchor 02e563da… round 34188053</span><br>
    <span class="g">$</span> cat &gt; game/index.html <span class="d"># 11 KB, one file</span><br>
    <span class="c">✓</span> player ship · falling blocks · stars<br>
    <span class="c">✓</span> score, lives, autopilot demo mode<br>
    <span class="g">$</span> chrome --headless --screenshot <span class="d"># it runs</span><br>
    <span class="y">▶</span> NEON DODGE — <span class="p">ready to play</span><br>
    <span class="g">$</span> <span class="cursor"></span>
  </div>
  <div class="foot">wrote the code. <b>tested it.</b> filmed it.</div>
</body></html>
